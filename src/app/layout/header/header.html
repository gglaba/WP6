<nav class="site-nav">
  <div class="site-nav-inner">
    <a routerLink="/" class="site-brand" aria-label="WP6 — strona główna">
      <span class="site-brand-mark">WP6</span>
      <span class="site-brand-copy">
        <strong>Wojska Polskiego 6</strong>
        <small>Lokale użytkowe · Bystrzyca Kłodzka</small>
      </span>
    </a>

    <button
      class="site-menu-toggle"
      type="button"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-navigation"
      [attr.aria-label]="menuOpen() ? 'Zamknij menu' : 'Otwórz menu'">
      <i [class]="menuOpen() ? 'pi pi-times' : 'pi pi-bars'"></i>
    </button>

    <ul id="site-navigation" class="site-links">
      <li>
        <a routerLink="/"
           routerLinkActive="text-blue-600 font-medium"
           [routerLinkActiveOptions]="{ exact: true }"
           class="site-link">
          Strona główna
        </a>
      </li>
      <li>
        <a routerLink="/rooms"
           routerLinkActive="text-blue-600 font-medium"
           class="site-link">
          Oferta
        </a>
      </li>
      <li>
        <a routerLink="/about"
           routerLinkActive="text-blue-600 font-medium"
           class="site-link">
          O nas
        </a>
      </li>
      <li>
        <a routerLink="/contact"
           routerLinkActive="text-blue-600 font-medium"
           class="site-link">
          Kontakt
        </a>
      </li>
    </ul>

    <a class="site-nav-cta" href="tel:+48514270784">
      <i class="pi pi-phone"></i>
      <span>Zadzwoń</span>
    </a>
  </div>

  @if (menuOpen()) {
    <div class="site-mobile-panel">
      <ul class="site-mobile-links">
        <li>
          <a routerLink="/" (click)="menuOpen.set(false)"
             class="site-mobile-link">
            Strona główna
          </a>
        </li>
        <li>
          <a routerLink="/rooms" (click)="menuOpen.set(false)"
             class="site-mobile-link">
            Oferta
          </a>
        </li>
        <li>
          <a routerLink="/about" (click)="menuOpen.set(false)"
             class="site-mobile-link">
            O nas
          </a>
        </li>
        <li>
          <a routerLink="/contact" (click)="menuOpen.set(false)"
             class="site-mobile-link">
            Kontakt
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
